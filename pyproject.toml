[project]
name = "floodnet-segmentation"
version = "0.1.0"
description = "U-Net hibrido CNN + ViT para segmentacion semantica de FloodNet Track 1"
requires-python = "==3.12.*"

dependencies = [
    # --- deep learning ---
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0.9",
    # --- datos e imagen ---
    "albumentations>=1.4.24",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # --- visualizacion ---
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    # --- entorno de notebook ---
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    # --- modelos de comparacion (YOLO-seg y DeepLabV3+) ---
    "ultralytics>=8.4.177",
    "segmentation-models-pytorch>=0.5.0",
    # --- exportacion e inferencia ONNX ---
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",        # exportador de torch.onnx (dynamo)
    "onnxslim>=0.1.98",         # lo usa Ultralytics al exportar; declarado para que no lo autoinstale
    # Las ruedas recientes de PyPI (p. ej. 1.31) se compilan contra CUDA 13 y no cargan
    # junto a torch cu126. La 1.24 esta comprobada con CUDA 12.
    "onnxruntime-gpu>=1.24,<1.25",
]

[tool.uv]
# Proyecto "virtual": no se instala a si mismo como paquete, solo gestiona el entorno.
package = false

# Las ruedas de PyTorch con CUDA no estan en PyPI, viven en su propio indice.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# explicit = true arriba + estas fuentes = SOLO torch y torchvision salen de ese
# indice; el resto de dependencias siguen viniendo de PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
